---
# Generate the deploy keypair ON the infra box (idempotent via `creates`), so the
# private key never leaves this host. The public key is exposed as a fact and
# authorised on the prod deploy account by the deploy_target role.
- name: Ensure deploy key directory
  ansible.builtin.file:
    path: "{{ deploy_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate deploy keypair
  ansible.builtin.command:
    cmd: 'ssh-keygen -t ed25519 -N "" -C "deploy@chesstopia-runner" -f {{ deploy_key_path }}'
    creates: "{{ deploy_key_path }}"

- name: Read deploy public key
  ansible.builtin.slurp:
    src: "{{ deploy_key_path }}.pub"
  register: deploy_pubkey_file

- name: Expose deploy public key as a fact (consumed by the prod play)
  ansible.builtin.set_fact:
    deploy_runner_pubkey: "{{ deploy_pubkey_file.content | b64decode | trim }}"
