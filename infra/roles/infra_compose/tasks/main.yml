---
# Deploy the infrastructure compose stack (Bitbucket runner) on the infra box.
- name: Create infra compose directory
  ansible.builtin.file:
    path: "{{ infra_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render infra .env (runner secrets from vault)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ infra_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Render infra docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.infra.yml.j2
    dest: "{{ infra_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

# ── Deploy image (baked SSH key) for the pipeline's `deploy to prod` step ─────
# Pipeline steps run as sibling containers and cannot see the runner's bind
# mounts, so the deploy step can't read a host-mounted key. Instead we bake the
# deploy keypair's private key + a pinned known_hosts into a dedicated image and
# pull it from the local registry. Built here on the host: the key (deploy_key
# role) and prod's host-key fact (common role, no-TOFU pinning) are both
# available during a full site.yml run; guarded otherwise.
# SECURITY: the private key sits unencrypted in this image in the unauthenticated
# plain-HTTP registry; confidentiality rests on private-network + UFW. It only
# grants the unprivileged deploy@prod account.
- name: Create build context for the deploy image
  ansible.builtin.file:
    path: "{{ deploy_image_build_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: hostvars['prod-app'].host_ed25519_pubkey is defined

- name: Copy deploy Dockerfile into the build context
  ansible.builtin.copy:
    src: deploy-image/Dockerfile
    dest: "{{ deploy_image_build_dir }}/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  when: hostvars['prod-app'].host_ed25519_pubkey is defined

- name: Stage the deploy private key into the build context
  ansible.builtin.copy:
    src: "{{ deploy_key_path }}"
    dest: "{{ deploy_image_build_dir }}/deploy_key"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when: hostvars['prod-app'].host_ed25519_pubkey is defined

- name: Render the pinned known_hosts into the build context
  ansible.builtin.template:
    src: known_hosts.j2
    dest: "{{ deploy_image_build_dir }}/known_hosts"
    owner: root
    group: root
    mode: "0644"
  when: hostvars['prod-app'].host_ed25519_pubkey is defined

- name: Build + push the deploy image
  community.docker.docker_image:
    name: "{{ registry_host }}/chesstopia-deploy"
    tag: latest
    source: build
    build:
      path: "{{ deploy_image_build_dir }}"
    force_source: true
    push: true
  when: hostvars['prod-app'].host_ed25519_pubkey is defined

- name: Bring up the infra stack
  community.docker.docker_compose_v2:
    project_src: "{{ infra_compose_dir }}"
    state: present
