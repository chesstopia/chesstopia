---
# Single host since ADR-0011: the infra box (self-hosted runner + private registry)
# is gone. CI runs on GitHub-hosted runners, images live in GHCR, and the Hetzner
# private network has no second participant left.
all:
  vars:
    # Default connection user is the admin account. For the first contact with a
    # fresh box, override on the CLI: -e ansible_user=root
    ansible_user: "{{ admin_user }}"
    ansible_python_interpreter: /usr/bin/python3
  children:
    prod:
      hosts:
        prod-app:
          ansible_host: 46.225.235.229
