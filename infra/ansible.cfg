[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
# Privilege escalation (become) and vault are NOT forced here on purpose:
#   - bootstrap.yml runs as root  -> no become, no prompt
#   - site.yml runs as admin user -> become via passwordless sudo (no prompt),
#     EXCEPT the very first prod run still needs --ask-become-pass (see README)
#   - vault is only needed by the prod deploy_target role -> pass --ask-vault-pass
