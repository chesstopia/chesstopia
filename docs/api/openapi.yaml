openapi: 3.1.0
info:
  title: Chesstopia API
  description: REST API for the Chesstopia chess platform
  version: 0.0.1

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/v1/hello:
    get:
      operationId: getHello
      summary: Hello World
      description: Smoke-test endpoint — verifies the backend is reachable.
      tags:
        - hello
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'

components:
  schemas:
    HelloResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Hello from Chesstopia!"
