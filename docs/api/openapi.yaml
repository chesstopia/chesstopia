openapi: 3.1.0
info:
  title: Chesstopia API
  description: REST API for the Chesstopia chess platform
  version: 0.0.1

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/v1/counter:
    post:
      operationId: incrementCounter
      summary: Zähler erhöhen
      description: >
        Erhöht den persistierten Zähler um eins und gibt den neuen Wert zurück.
        Durchstich durch Persistenz und Codegen-Kette — kein fachlicher Endpunkt.
      tags:
        - counter
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterResponse"

  /api/v1/game/board:
    get:
      operationId: getBoard
      summary: Initialen Schachbrettzustand abrufen
      description: Gibt den aktuellen Spielzustand als FEN-String zurück.
      tags:
        - game
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardStateResponse"

  /api/v1/hello:
    get:
      operationId: getHello
      summary: Hello World
      description: Smoke-test endpoint — verifies the backend is reachable.
      tags:
        - hello
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"

components:
  schemas:
    CounterResponse:
      type: object
      required:
        - value
      properties:
        value:
          type: integer
          format: int32
          description: Der Zählerstand nach der Erhöhung
          example: 1

    BoardStateResponse:
      type: object
      required:
        - fen
      properties:
        fen:
          type: string
          description: Aktuelle Stellung in FEN-Notation
          example: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"

    HelloResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Hello from Chesstopia!"
