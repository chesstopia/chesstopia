# SPA serving config: serve static assets, fall back to index.html so client-side
# routes resolve. TLS and /api/* routing are handled upstream by Caddy (edge stack).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
