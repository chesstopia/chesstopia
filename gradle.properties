# Disable automatic JDK download via foojay provisioning.
# foojay-resolver-convention 0.9.0 is incompatible with Gradle 9.5.1 (IBM_SEMERU field removed).
# Remove once foojay-resolver-convention is updated for Gradle 9.x compatibility.
org.gradle.java.installations.auto-download=false

# Build cache: reuse task outputs across builds and across CI steps (chess-engine
# tasks become cache hits when the backend/frontend composite build runs them).
org.gradle.caching=true

# No long-lived daemon in fresh CI containers — it only adds startup overhead.
org.gradle.daemon=false
