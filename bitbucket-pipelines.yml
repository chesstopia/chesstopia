# Chesstopia CI — build & test health check.
#
# Structure (see docs/adr/0009-ci-pipeline-build-test.md):
#   Stage 1: chess-engine (build + test) — warms the Gradle build cache
#   Stage 2 (parallel): backend + frontend — get cache hits on the chess-engine tasks
#
# JDK 25 is mandatory and Gradle toolchain auto-download is disabled (foojay is
# incompatible with Gradle 9.5.1), so the image must ship JDK 25. Node.js and pnpm
# are downloaded by the node-gradle plugin — they are NOT needed in the image.
image: eclipse-temurin:25-jdk

definitions:
  caches:
    # Gradle dependencies + build cache (~/.gradle/caches/build-cache-1).
    # File-keyed: the cache is rebuilt when build inputs change, avoiding the
    # "stale named cache re-downloads every run" trap.
    gradlecache:
      key:
        files:
          - gradle/libs.versions.toml
          - "**/*.gradle.kts"
          - gradle.properties
      path: ~/.gradle/caches
    # Gradle 9.5.1 distribution downloaded by the wrapper (~120 MB).
    gradlewrapper:
      path: ~/.gradle/wrapper
    # Node.js + pnpm binaries downloaded by the node-gradle plugin (project-local).
    gradlenode:
      path: .gradle/nodejs
    gradlepnpm:
      path: .gradle/pnpm
    # pnpm content-addressable store. File-keyed on the lockfile.
    pnpmstore:
      key:
        files:
          - pnpm-lock.yaml
      path: ~/.local/share/pnpm/store

  services:
    # Override the built-in `docker` service with our custom dind that trusts the
    # plain-HTTP private registry (--insecure-registry). The image is prebuilt
    # onto the infra host and pushed to the local registry by the `registry`
    # Ansible role; the host daemon (which trusts 10.0.0.3:5000) pulls it here.
    docker:
      image: 10.0.0.3:5000/chesstopia-dind:latest
      variables:
        DOCKER_OPTS: "--insecure-registry=10.0.0.3:5000"

  steps:
    - step: &chess-engine
        name: chess-engine (build + test)
        runs-on:
          - self.hosted
          - linux
        caches:
          - gradlecache
          - gradlewrapper
        script:
          - ./gradlew chessEngineBuild

    - step: &backend
        name: backend (build + test)
        runs-on:
          - self.hosted
          - linux
        caches:
          - gradlecache
          - gradlewrapper
        script:
          # The tests start an embedded Postgres from native binaries (Zonky). Its
          # initdb/postgres binaries refuse to run as root, but the temurin image
          # runs as root — so the whole build must run as an unprivileged user.
          # Create one, hand it the sources and the (root-owned) restored Gradle
          # caches, and keep GRADLE_USER_HOME pinned to /root/.gradle so the
          # ~/.gradle cache mounts still hit.
          - useradd -m -u 1001 builder
          # /root is mode 700, so builder cannot traverse into /root/.gradle even
          # once it owns it — grant the execute (traverse) bit, not read.
          - chmod 711 /root
          - chown -R builder:builder "$BITBUCKET_CLONE_DIR" /root/.gradle
          # Pulls chess-engine JVM jar via composite build (cache hit), then
          # builds + tests the backend (tests use embedded Postgres, no DB service).
          - su builder -c "cd '$BITBUCKET_CLONE_DIR' && GRADLE_USER_HOME=/root/.gradle ./gradlew :chesstopia-backend:build"
        # Hand the bootJar to the later package-and-push step (main only; harmless
        # on PR/branch runs). bootJar is named app.jar; the plain jar is disabled.
        artifacts:
          - chesstopia-backend/build/libs/app.jar

    - step: &frontend
        name: frontend (lint + test + build)
        runs-on:
          - self.hosted
          - linux
        caches:
          - gradlecache
          - gradlewrapper
          - gradlenode
          - gradlepnpm
          - pnpmstore
        script:
          # chess-engine JS library is built via the pnpmInstall task dependency (cache hit).
          - ./gradlew pnpmFrontendLint pnpmFrontendTest pnpmFrontendBuild
        # Hand the built SPA bundle to the package-and-push step.
        artifacts:
          - chesstopia-frontend/dist/**

    # ── Deploy-only steps (main branch) ───────────────────────────────────────
    # Both the registry host and the prod host are hardcoded here: they live on
    # the Hetzner private network, are not secret, and already appear in the
    # Ansible inventory (see docs/adr/0010-deployment-cicd-infrastruktur.md).

    - step: &package-and-push
        name: package & push images
        runs-on:
          - self.hosted
          - linux
        # `services: docker` provides the docker CLI in this step plus a
        # Docker-in-Docker daemon to build/push with. We override the stock dind
        # (see the custom `docker` service in `definitions` below) so dockerd
        # trusts the plain-HTTP private registry via --insecure-registry; stock
        # dind probes it over HTTPS and hangs (connection timeout on push).
        services:
          - docker
        script:
          - export TAG=${BITBUCKET_COMMIT:0:7}
          - export IMAGE_REGISTRY=10.0.0.3:5000
          # Artefact-copy Dockerfiles: no Gradle/pnpm here, just COPY the artifacts
          # produced by the backend/frontend steps above.
          - docker build -t $IMAGE_REGISTRY/chesstopia-backend:$TAG chesstopia-backend
          - docker build -t $IMAGE_REGISTRY/chesstopia-frontend:$TAG chesstopia-frontend
          - docker push $IMAGE_REGISTRY/chesstopia-backend:$TAG
          - docker push $IMAGE_REGISTRY/chesstopia-frontend:$TAG

    - step: &deploy
        name: deploy to prod
        # Manual gate: a human triggers the only production environment by hand.
        trigger: manual
        runs-on:
          - self.hosted
          - linux
        # Custom image (built by the infra_compose role, pulled from the local
        # registry) with openssh-client plus the deploy key + pinned known_hosts
        # baked in — sibling step containers can't see the runner's host mounts.
        image: 10.0.0.3:5000/chesstopia-deploy:latest
        script:
          - export TAG=${BITBUCKET_COMMIT:0:7}
          - export DEPLOY_HOST=10.0.0.2
          - export SSHOPTS="-i /root/.ssh/deploy_key -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          # Ship the app-stack compose file (keeps prod == repo), then pull + up.
          # IMAGE_TAG pins both images to this commit; .env (secrets, IMAGE_REGISTRY)
          # is already on the box, rendered by Ansible.
          - scp $SSHOPTS docker-compose.prod.yml deploy@$DEPLOY_HOST:/opt/chesstopia/
          # -f: the file keeps its repo name on the box, so it is not a compose
          # default name; .env is still auto-loaded from the project dir (cwd).
          - ssh $SSHOPTS deploy@$DEPLOY_HOST "cd /opt/chesstopia && IMAGE_TAG=$TAG docker compose -f docker-compose.prod.yml pull && IMAGE_TAG=$TAG docker compose -f docker-compose.prod.yml up -d"

pipelines:
  pull-requests:
    "**":
      - step: *chess-engine
      - parallel:
          - step: *backend
          - step: *frontend

  branches:
    # main also builds + pushes images and offers a manual deploy. The image
    # build/push runs ONLY here, never on feature branches or PRs (no throwaway
    # images in the registry).
    "**":
      - step: *chess-engine
      - parallel:
          - step: *backend
          - step: *frontend
      - step: *package-and-push
      - step: *deploy
    # "**":
    #   - step: *chess-engine
    #   - parallel:
    #       - step: *backend
    #       - step: *frontend
