# Dieser Workflow trägt die Verbindlichkeit von checkDocs. Lokal ist der Task
# eigenständig und bewusst nicht an `check` gehängt — ein toter Doku-Link soll
# den Compiler nicht aufhalten. Hier blockiert er den Merge, ohne die lokale
# Arbeit zu unterbrechen.

name: checkDocs

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew checkDocs
