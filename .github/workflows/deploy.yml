# Deploy the app stack to the Hetzner prod box.
# See docs/adr/0011-migration-nach-github-actions.md.
#
# Deliberately a SEPARATE workflow, not a job in the CI chain: the tag input makes
# "deploy" and "roll back to an older hash" the same button, and lets you redeploy
# without rebuilding. Clicking "Run workflow" is the human gate that Bitbucket's
# `trigger: manual` used to be.
#
# The job runs in the GitHub environment `production`, which is what scopes
# DEPLOY_SSH_KEY: an environment secret with a `main` branch rule cannot be read by
# a workflow on a feature branch, and never by a fork PR.
#
# It only ever touches the STATELESS app stack (backend + frontend). Postgres (db)
# and Caddy (edge) live in separate Ansible-managed compose projects — the pipeline
# structurally cannot take down TLS, the cert store or the database (ADR-0010).
name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (7-char git short SHA). Empty = current main."
        required: false
        type: string

permissions:
  contents: read
  packages: read   # only for the pre-flight manifest check below; prod pulls anonymously

env:
  DEPLOY_HOST: ${{ vars.PROD_HOST }}
  APP_DIR: /opt/chesstopia
  # Same constraint as in ci.yml: Gradle toolchain auto-download is off, so the
  # runner must bring the JDK. Needed here only for the post-deploy smoke run.
  JAVA_VERSION: "25"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://46.225.235.229.sslip.io
    steps:
      # Checks out the ref you dispatched from (main by default). That ref supplies
      # docker-compose.prod.yml and, unless `tag` is given, the image tag.
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail before touching prod if the tag was never built — otherwise `compose up`
      # would tear the running containers down and then fail to pull.
      - name: Verify both images exist in GHCR
        run: |
          for img in backend frontend; do
            docker manifest inspect "ghcr.io/chesstopia/chesstopia-$img:${{ steps.meta.outputs.tag }}" > /dev/null \
              || { echo "::error::ghcr.io/chesstopia/chesstopia-$img:${{ steps.meta.outputs.tag }} does not exist"; exit 1; }
          done

      # Host-key pinning, not TOFU: PROD_SSH_KNOWN_HOSTS is generated by Ansible from
      # prod's own /etc/ssh/ssh_host_ed25519_key.pub over the already-trusted Ansible
      # connection (infra/roles/deploy_target). It is a variable, not a secret — host
      # keys are public by design.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS"    > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/known_hosts

      # Ship the compose file so prod always matches the repo. The secret .env
      # (POSTGRES_*, JWT_SECRET, IMAGE_REGISTRY, …) is rendered on the box by Ansible
      # and is never written from here — prod secrets stay on prod.
      - name: Ship the app compose file
        run: |
          scp -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml "deploy@$DEPLOY_HOST:$APP_DIR/"

      # -f keeps the file's repo name on the box (so it is not a compose default
      # name); .env is still auto-loaded from the project directory (cwd).
      - name: Pull & restart the app stack
        run: |
          ssh -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST" \
            "cd $APP_DIR \
             && IMAGE_TAG=${{ steps.meta.outputs.tag }} docker compose -f docker-compose.prod.yml pull \
             && IMAGE_TAG=${{ steps.meta.outputs.tag }} docker compose -f docker-compose.prod.yml up -d"

      # Smoke is level 4, subset (ADR-0019): the one end-to-end run after every
      # deploy. Against the prod URL, without a stack of its own — once
      # PLAYWRIGHT_BASE_URL is set, playwright.config.ts skips the webServer
      # entries. Node and pnpm come from the node-gradle plugin, so both steps go
      # through Gradle rather than a bare `pnpm`, which is not on the runner PATH.
      #
      # The run creates one game and plays one move in the production database.
      # That is the price of testing the real thing; see docs/notes/e2e-aufbau.md.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew playwrightInstallBrowsers
      - name: Smoke-Test gegen die frisch deployte Umgebung
        env:
          # Repeats environment.url above. Deliberate: GitHub exposes no output
          # for it, and an expression pointing at a non-existent output would be
          # silently empty. Resolving the duplication means lifting the URL into
          # a repository variable — which removes it from both places, not one.
          PLAYWRIGHT_BASE_URL: https://46.225.235.229.sslip.io
        run: ./gradlew playwrightSmoke

      - name: Report
        run: echo "Deployed \`${{ steps.meta.outputs.tag }}\` to prod." >> "$GITHUB_STEP_SUMMARY"
