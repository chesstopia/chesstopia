# Chesstopia CI — jedes Artefakt einmal bauen, in dieser Form testen, in dieser
# Form ausliefern. Siehe docs/adr/0028-artefakt-kette-und-e2e-gegen-den-prod-stack.md.
#
# Topologie:
#
#   engine  ‖  backend  ‖  frontend           reine Bau- und Pruefjobs, ~60 s
#                │           │
#                ▼           ▼
#        backend-image   frontend-image       nur Artefakt + buildx + push
#                └─────┬─────┘
#                      ▼
#                     e2e                     Prod-Stack unter Compose
#
# Das Jar entsteht im Job `backend`, wird dort von der Testsuite geprueft, als
# Artefakt uebergeben und in genau dieser Form ins Image kopiert. `upload-artifact`
# ist eine bytetreue Uebergabe — das getestete Jar ist das ausgelieferte. Dasselbe
# fuer das Frontend-Bundle.
#
# Die Image-Jobs fuehren keinen Projektcode aus. Nur sie tragen `packages: write`;
# die Build-Jobs, die Gradle und pnpm mit allen Fremdabhaengigkeiten ausfuehren,
# haben keine Registry-Rechte.
#
# `engine` haengt in den `needs:` der Image-Jobs, weil die Engine-Testsuite
# ausschliesslich dort laeuft — `backend` konsumiert nur die Jar-Task, `frontend`
# nur die JS-Distribution. Ohne diese Kante entstuende bei roter Engine-Suite ein
# Image. `engine` laeuft parallel zu `backend`, die Kette wartet dadurch kaum.
#
# Kein Gate hinter `e2e`: Die Images sind gepusht und deploybar, bevor Playwright
# startet. Das ist bewusst und benannt (ADR-0028, ## Consequences) — der Mensch an
# deploy.yml traegt es, bis Retention-Policy und ein `promote`-Job kommen.
name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # JDK 25 is mandatory and Gradle toolchain auto-download is disabled (foojay is
  # incompatible with Gradle 9.5.1), so the runner must provide the JDK itself.
  JAVA_VERSION: "25"
  REGISTRY: ghcr.io/chesstopia

jobs:
  engine:
    name: chess-engine (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # The engine's own tests run ONLY here: the backend build merely consumes the
      # engine's jar task, it does not run the engine's test suite.
      - run: ./gradlew chessEngineBuild

  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # Tests boot an embedded Postgres from native binaries (Zonky, ADR-0012), whose
      # initdb refuses to run as root. GitHub runners are already the unprivileged
      # `runner` user.
      - run: ./gradlew :chesstopia-backend:build
      # Genau dieses Jar geht ins Image. Kein zweiter Build.
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: chesstopia-backend/build/libs/app.jar
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # Node and pnpm are downloaded by the node-gradle plugin into the PROJECT dir,
      # so setup-gradle's ~/.gradle cache does not cover them. Same for the pnpm store.
      - name: Cache node/pnpm toolchain + pnpm store
        uses: actions/cache@v4
        with:
          path: |
            .gradle/nodejs
            .gradle/pnpm
            ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'build.gradle.kts') }}
          restore-keys: pnpm-${{ runner.os }}-
      # generateOpenApiClient ist Pflicht, nicht Kosmetik: pnpmFrontendBuild haengt
      # nicht daran, und auf einem frischen Checkout ist openapi-client/src leer.
      - run: ./gradlew generateOpenApiClient pnpmFrontendLint pnpmFrontendTest pnpmFrontendBuild
      # Genau dieses Bundle geht ins Image.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: chesstopia-frontend/dist
          if-no-files-found: error
          retention-days: 1

  backend-image:
    name: backend image
    needs: [backend, engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Checkout liefert nur das Dockerfile — hier wird nichts gebaut, was Quellcode
      # braucht. Das Dockerfile ist eine reine Artefakt-Kopie.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: chesstopia-backend/build/libs
      - name: Image-Tag bestimmen
        id: meta
        # Der Git-Short-Hash und nichts sonst — kein wanderndes `latest`, damit
        # jeder Deploy und jeder Rollback genau einen Commit festnagelt (ADR-0010).
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Das automatische Run-Token reicht fuer GHCR — kein PAT irgendwo.
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: chesstopia-backend
          push: true
          tags: ${{ env.REGISTRY }}/chesstopia-backend:${{ steps.meta.outputs.tag }}

  frontend-image:
    name: frontend image
    needs: [frontend, engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: chesstopia-frontend/dist
      - name: Image-Tag bestimmen
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: chesstopia-frontend
          push: true
          tags: ${{ env.REGISTRY }}/chesstopia-frontend:${{ steps.meta.outputs.tag }}

  e2e:
    name: e2e (Prod-Stack + Playwright)
    needs: [backend-image, frontend-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # Compose liest beide Dateien aus dieser Variablen — spart die Wiederholung
      # der -f-Paare in jedem Schritt.
      COMPOSE_FILE: docker-compose.prod.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
      # Node direkt, nicht ueber Gradle: e2e/ ist seit ADR-0028 ein Black-Box-Client
      # mit eigenem Lockfile und haengt nicht mehr an pnpmInstall — und damit auch
      # nicht mehr an der JS-Distribution der Kotlin-Engine.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - name: Playwright installieren
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Umgebung des Stacks
        # Das `prod`-Profil loest ${POSTGRES_PASSWORD} und ${JWT_SECRET} auf und
        # bricht unbelegt beim Start ab. Die Werte entstehen hier und leben so lange
        # wie der Job; im Repo steht keiner (Verbot 6).
        run: |
          set -euo pipefail
          {
            echo "IMAGE_REGISTRY=${REGISTRY}"
            echo "IMAGE_TAG=${GITHUB_SHA::7}"
            echo "POSTGRES_DB=chesstopia_dev"
            echo "POSTGRES_USER=chesstopia"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "CHESSCOACH_API_KEY=$(openssl rand -hex 8)"
          } >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prod-Stack hochfahren
        run: |
          set -euo pipefail
          # In Produktion legt Ansible dieses Netz an; docker-compose.prod.yml
          # erwartet es als `external`.
          docker network create chesstopia
          # Explizit ziehen: Damit ist belegt, dass die Images den Registry-Roundtrip
          # ueberstanden haben, und `up` baut sie nicht aus `build:` neu.
          docker compose pull backend frontend
          docker compose up -d

      - name: Auf den Stack warten
        run: |
          set -euo pipefail
          # Durch Caddy hindurch: Die Sonde belegt die /api/*-Route, das Backend und
          # die Datenbankverbindung in einem Zug.
          for i in $(seq 1 90); do
            if [ "$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/hello || true)" = "200" ]; then
              echo "Stack bereit nach $((i * 2)) s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Der Stack kam nicht hoch"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Playwright
        working-directory: e2e
        env:
          CI: "true"
        run: pnpm run test

      - name: Stack-Logs bei Fehlschlag
        if: failure()
        run: docker compose logs --tail=400

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
