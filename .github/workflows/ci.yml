# Chesstopia CI — build, test, and (on main) publish the container images.
# Siehe docs/adr/0027-integrationsjob-baut-und-testet-die-images.md.
#
# Topologie:
#
#   t=0   chess-engine ‖ backend ‖ frontend        reine Prüfjobs, ~60 s
#         integration                              kritischer Pfad, ~205 s
#           E2E → beide Images bauen → (nur main) provisorisch pushen
#         └─► push (nur main, needs: alle vier)    promotet auf den endgültigen Tag
#
# Die drei Prüfjobs bauen die chess-engine transitiv jeder für sich — Backend über
# den Composite Build, Frontend über die pnpmInstall → jsBrowserProductionLibrary-
# Distribution-Kette (ADR-0006). Die Redundanz ist Absicht: auf einem public Repo
# sind die Minuten frei, die Jobs laufen auf getrennten VMs, und es gibt keinen
# jobübergreifenden Cache-Schlüssel, der still danebengreifen kann. ADR-0009
# sequenzierte anders herum, weil Bitbucket pro Minute abrechnete.
#
# Neu gegenüber ADR-0011: Die Images entstehen NICHT mehr in einem eigenen Job aus
# heruntergeladenen Artefakten, sondern im Integrationsjob aus demselben Workspace,
# in dem E2E gerade gelaufen ist. Das getestete und das ausgelieferte Jar sind damit
# dieselbe Datei — ein Boot-Jar ist nicht bit-reproduzierbar, zwei Builds ergeben
# zwei verschiedene Artefakte. Gebaut wird auf jedem Branch (das fängt ein kaputtes
# Dockerfile im PR), gepusht nur auf main.
#
# "Ein roter Durchstich verdient kein Image" gilt weiter, wandert aber von `needs:`
# in die Schrittreihenfolge: Der Image-Build steht hinter dem E2E-Schritt, ein roter
# E2E-Lauf bricht den Job vorher ab.
name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # JDK 25 is mandatory and Gradle toolchain auto-download is disabled (foojay is
  # incompatible with Gradle 9.5.1), so the runner must provide the JDK itself.
  JAVA_VERSION: "25"

jobs:
  chess-engine:
    name: chess-engine (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # The engine's own tests run ONLY here: the backend build merely consumes the
      # engine's jar task, it does not run the engine's test suite.
      - run: ./gradlew chessEngineBuild

  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # Tests boot an embedded Postgres from native binaries (Zonky, ADR-0012), whose
      # initdb refuses to run as root. GitHub runners are already the unprivileged
      # `runner` user, so the useradd dance the Bitbucket pipeline needed is gone.
      - run: ./gradlew :chesstopia-backend:build

  frontend:
    name: frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # Node and pnpm are downloaded by the node-gradle plugin into the PROJECT dir,
      # so setup-gradle's ~/.gradle cache does not cover them. Same for the pnpm store.
      - name: Cache node/pnpm toolchain + pnpm store
        uses: actions/cache@v4
        with:
          path: |
            .gradle/nodejs
            .gradle/pnpm
            ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'build.gradle.kts') }}
          restore-keys: pnpm-${{ runner.os }}-
      # generateOpenApiClient runs here from the start. ADR-0009 flagged it as a
      # latent dependency: the task lived only in `buildAll`, so the pipeline would
      # have gone red the moment the frontend actually imports @chesstopia/openapi-client.
      - run: ./gradlew generateOpenApiClient pnpmFrontendLint pnpmFrontendTest pnpmFrontendBuild

  integration:
    name: integration (E2E + Images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Wird nur von den Push-Schritten ganz unten gebraucht, die an
      # `if: github.ref == 'refs/heads/main'` hängen. Bei einem PR aus einem Fork
      # ist das GITHUB_TOKEN read-only — dort laufen diese Schritte nie.
      packages: write
    services:
      # Level 4 runs against a real database. Database and role match
      # docker-compose.yml so application.yml fits unchanged — there is no
      # separate E2E profile.
      #
      # No POSTGRES_PASSWORD on purpose. Regel 10 in gradle/check-docs.gradle.kts
      # rejects literal credentials anywhere under .github/workflows/, and it is
      # right to: a workflow is no place to learn which literals are harmless.
      # `trust` removes the credential instead of hiding it — the container is
      # reachable only from this job's network and dies with the job, and the
      # password application.yml sends is accepted whatever it is.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chesstopia_dev
          POSTGRES_USER: chesstopia
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache node/pnpm toolchain + pnpm store
        uses: actions/cache@v4
        with:
          path: |
            .gradle/nodejs
            .gradle/pnpm
            ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'build.gradle.kts') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Browser über Gradle, nicht über ein blankes `pnpm` — pnpm liegt unter
      # .gradle/pnpm und ist auf dem Runner nicht auf dem PATH. Die PnpmTask
      # legt ihn für ihre Kindprozesse selbst dorthin, weshalb Playwrights
      # webServer-Kommando weiter unten `pnpm` findet.
      - run: ./gradlew playwrightInstallBrowsers
      - run: ./gradlew pnpmE2eTest
        env:
          CI: true

      # ── Ab hier: Images. Bewusst NACH dem E2E-Schritt — ein roter Durchstich
      # bricht den Job ab, bevor irgendetwas gebaut oder gepusht wird.
      - name: Resolve image tag
        id: meta
        # Image-Tag ist der Git-Short-Hash und nichts sonst — kein wanderndes
        # `latest`, damit jeder Deploy und jeder Rollback genau einen Commit
        # festnagelt (ADR-0010).
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Beide Dockerfiles sind reine Artefakt-Kopien (COPY des fertigen Jars bzw.
      # dist-Ordners — kein Gradle, kein pnpm in der Docker-Schicht). Der
      # Build-Kontext ist deshalb genau der Workspace, in dem E2E gerade lief.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: chesstopia-backend
          push: false
          load: true
          tags: ghcr.io/chesstopia/chesstopia-backend:${{ steps.meta.outputs.tag }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: chesstopia-frontend
          push: false
          load: true
          tags: ghcr.io/chesstopia/chesstopia-frontend:${{ steps.meta.outputs.tag }}
